name: CI

on:
  push:
    branches:
      - develop
      - master
      - main
  pull_request:

jobs:
  validate:
    name: Install, build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  docker:
    name: Docker build and compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          printf '%s\n' \
            'NODE_ENV=development' \
            'PORT=3000' \
            'DATABASE_USER=postgres' \
            'DATABASE_HOST=postgres' \
            'DATABASE_NAME=quimiport' \
            'DATABASE_PASSWORD=postgres' \
            'DATABASE_PORT=5432' > .env

      - name: Validate Compose file
        run: docker compose config

      - name: Build API image
        run: docker compose build app

      - name: Start API and Postgres
        run: docker compose up -d --wait postgres app

      - name: Check API is up
        run: curl -sf --retry 15 --retry-all-errors --retry-delay 2 http://localhost:3000/docs

      - name: Stop containers
        if: always()
        run: docker compose down -v
